services:
  postgres-auth:
    image: pgvector/pgvector:pg16
    container_name: wellwipes-postgres-auth
    environment:
      POSTGRES_DB: wellwipes_auth
      POSTGRES_USER: wellwipes
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellwipes -d wellwipes_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellwipes-net

  postgres-product:
    image: pgvector/pgvector:pg16
    container_name: wellwipes-postgres-product
    environment:
      POSTGRES_DB: wellwipes_product
      POSTGRES_USER: wellwipes
      POSTGRES_PASSWORD: changeme
    ports:
      - "5434:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellwipes -d wellwipes_product"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellwipes-net

  postgres-order:
    image: pgvector/pgvector:pg16
    container_name: wellwipes-postgres-order
    environment:
      POSTGRES_DB: wellwipes_order
      POSTGRES_USER: wellwipes
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellwipes -d wellwipes_order"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellwipes-net

  postgres-ai:
    image: pgvector/pgvector:pg16
    container_name: wellwipes-postgres-ai
    environment:
      POSTGRES_DB: wellwipes_ai
      POSTGRES_USER: wellwipes
      POSTGRES_PASSWORD: changeme
    ports:
      - "5436:5432"
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellwipes -d wellwipes_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellwipes-net

  redis:
    image: redis:7.2-alpine
    container_name: wellwipes-redis
    command: ["redis-server", "--requirepass", "changeme", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wellwipes-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: wellwipes-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - wellwipes-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wellwipes-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wellwipes-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - wellwipes-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wellwipes-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wellwipes.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - wellwipes-net

networks:
  wellwipes-net:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-product-data:
  postgres-order-data:
  postgres-ai-data:
  redis-data:
  kafka-data:
  pgadmin-data:
