server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: ${AUTH_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/auth/**,/oauth2/**,/login/oauth2/**
          - id: product-service
            uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/products/**,/api/v1/categories/**
          - id: payment-service
            uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/payments/**
          - id: order-service
            uri: ${ORDER_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/orders/**,/api/v1/coupons/**
          - id: admin-service
            uri: ${ADMIN_SERVICE_URL:http://localhost:8086}
            predicates:
              - Path=/api/v1/admin/**
          - id: ai-service
            uri: ${AI_SERVICE_URL:http://localhost:8087}
            predicates:
              - Path=/api/v1/ai/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.wellwipes.apigateway: DEBUG
