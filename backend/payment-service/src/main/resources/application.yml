server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5435/wellwipes_order
    username: wellwipes
    password: changeme
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    template:
      default-topic: payment-events

wellwipes:
  jwt:
    secret: ${JWT_SECRET}
    issuer: well-wipes-auth
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    success-url: ${FRONTEND_URL:http://localhost:5173}/checkout/success?session_id={CHECKOUT_SESSION_ID}
    cancel-url: ${FRONTEND_URL:http://localhost:5173}/checkout/cancel

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.wellwipes.paymentservice: DEBUG
    com.stripe: INFO
